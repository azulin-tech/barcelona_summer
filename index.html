<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴塞罗那夏日企划 | Barcelona Summer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,300&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Google Translate (hidden — driven by custom selector) -->
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateInit"></script>
    <script>
        function googleTranslateInit() {
            new google.translate.TranslateElement({ pageLanguage: 'es', autoDisplay: false }, 'gt-hidden');
        }
    </script>
</head>
<body>

    <!-- Hidden Google Translate anchor -->
    <div id="gt-hidden" aria-hidden="true"></div>

    <!-- Film grain -->
    <div class="film-grain" aria-hidden="true"></div>

    <!-- Header — always on top, even over overlay -->
    <header id="main-header">
        <a href="index.html" class="logo">BARCELONA <em>Summer</em></a>
        <div class="header-right">
            <!-- Custom Language Selector -->
            <div class="lang-selector" id="lang-selector">
                <button class="lang-btn" id="lang-btn" aria-label="Idioma" aria-expanded="false">
                    <span class="lang-globe">🌐</span>
                    <span id="lang-current">ES</span>
                    <span class="lang-caret">▾</span>
                </button>
                <div class="lang-menu" id="lang-menu" aria-hidden="true"></div>
            </div>
            <!-- Hamburger -->
            <button id="menu-toggle" aria-label="Abrir menú" aria-expanded="false">
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>

    <!-- Fullscreen nav overlay — z-index BELOW header -->
    <nav id="menu-overlay" aria-hidden="true">
        <div class="menu-links" id="dynamic-menu">
            <!-- Populated by JS from Sections sheet -->
        </div>
    </nav>

    <!-- Home hero (video) -->
    <section id="hero-home" class="hero-section">
        <div class="video-container">
            <video autoplay loop muted playsinline id="bg-video">
                <source src="https://assets.mixkit.co/videos/preview/mixkit-waves-in-the-water-1164-large.mp4" type="video/mp4">
            </video>
            <div class="video-overlay"></div>
        </div>
        <div class="hero-text">
            <p class="subtitle-eng">A Mediterranean Story</p>
            <h1 class="main-title">巴塞罗那夏日企划</em></h1>
            <div class="hero-divider"></div>
            <p class="manifesto">Mar, sal, arena y aventura.<br>Historias desde el Mediterráneo.</p>
        </div>
    </section>

    <!-- Section sub-hero -->
    <section id="hero-sub" class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 id="page-h1"></h1>
            <p id="page-subtitle"></p>
        </div>
        <div class="transition-area">
            <div class="vertical-line"></div>
        </div>
    </section>

    <!-- Main content -->
    <main id="content"></main>

    <!-- Footer -->
    <footer id="main-footer">
        <div class="footer-inner">
            <p class="footer-logo">Barcelona Summer</p>
            <div class="footer-icons" aria-hidden="true"><span>☀</span><span>≈</span><span>⚓</span></div>
            <p class="footer-credit">INSPIRED BY THE MEDITERRANEAN SEA</p>
            <div class="footer-legal">
                <a href="aviso-legal.html">Aviso Legal</a>
                <a href="privacidad.html">Privacidad</a>
                <a href="cookies.html">Cookies</a>
                <button onclick="openConsentSettings()">Preferencias de cookies</button>
            </div>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="consent.js"></script>
    <script src="analytics.js"></script>
    <script src="app.js"></script>
</body>
</html>
